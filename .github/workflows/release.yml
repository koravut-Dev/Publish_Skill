name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint skills and scan for secrets
        run: node skills/publish-skill/scripts/publish-skill.mjs check --repo .
      - name: Build one zip per skill
        run: node skills/publish-skill/scripts/publish-skill.mjs pack --repo . --out dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
