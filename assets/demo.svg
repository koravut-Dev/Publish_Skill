<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 590" width="1280" height="590" role="img" aria-label="Terminal: publish-skill packaging a skill into a repo">
  <title>publish-skill packaging a skill into a repo</title>
  <style>
    .win{fill:#0b0b1e;stroke:#2a2a4a}
    .bar{fill:#15152e}
    .ttl{fill:#8b8fb8;font:600 15px 'Segoe UI',system-ui,sans-serif}
    text.l{font:19px ui-monospace,'Cascadia Code','SF Mono',Consolas,'Liberation Mono',monospace;fill:#c7c9e6;opacity:0;animation:in .35s ease-out forwards}
    .p{fill:#34d399}.c{fill:#f5f5ff;font-weight:700}.a{fill:#34d399}.w{fill:#67e8f9}.d{fill:#8b8fb8}.ok{fill:#f5f5ff;font-weight:700}.i{fill:#f9a8d4;font-weight:700}
    @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion: reduce){text.l{animation:none;opacity:1}}
  </style>
  <rect class="win" x="1" y="1" width="1278" height="588" rx="18"/>
  <path class="bar" d="M19 1h1242a18 18 0 0 1 18 18v27H1V19A18 18 0 0 1 19 1z"/>
  <circle cx="30" cy="24" r="7" fill="#f472b6"/><circle cx="54" cy="24" r="7" fill="#fbbf24"/><circle cx="78" cy="24" r="7" fill="#34d399"/>
  <text class="ttl" x="640" y="29" text-anchor="middle">publish-skill</text>
  <text class="l" x="32" y="92" style="animation-delay:.2s"><tspan class="p">$</tspan> <tspan class="c">node publish-skill.mjs publish</tspan> --skill ./my-skill --repo ./my-skills \</text>
  <text class="l" x="80" y="122" style="animation-delay:.2s">--plugin --ci --bump minor</text>
  <text class="l" x="32" y="166" style="animation-delay:1.1s"><tspan class="d">[my-skill]</tspan> add ./my-skill -> ./my-skills/skills/my-skill</text>
  <text class="l a" x="80" y="196" style="animation-delay:1.4s">+ SKILL.md</text>
  <text class="l a" x="80" y="226" style="animation-delay:1.6s">+ scripts/run.sh</text>
  <text class="l" x="32" y="256" style="animation-delay:2s">version (none) -> <tspan class="ok">1.0.0</tspan></text>
  <text class="l" x="32" y="286" style="animation-delay:2.3s"><tspan class="w">write</tspan> CHANGELOG.md</text>
  <text class="l" x="32" y="316" style="animation-delay:2.5s"><tspan class="w">write</tspan> LICENSE</text>
  <text class="l" x="32" y="346" style="animation-delay:2.7s"><tspan class="w">write</tspan> README.md <tspan class="d">(1 skill, en, full)</tspan></text>
  <text class="l" x="32" y="376" style="animation-delay:2.9s"><tspan class="w">write</tspan> .claude-plugin/plugin.json</text>
  <text class="l" x="32" y="406" style="animation-delay:3.1s"><tspan class="w">write</tspan> .github/workflows/validate-skills.yml</text>
  <text class="l" x="32" y="436" style="animation-delay:3.3s"><tspan class="w">write</tspan> .github/workflows/release.yml</text>
  <text class="l ok" x="32" y="496" style="animation-delay:4s">Done. 1 skill in the repo, version 1.0.0.</text>
  <text class="l" x="32" y="526" style="animation-delay:4.3s"><tspan class="d">After you push, others install with:</tspan></text>
  <text class="l i" x="80" y="556" style="animation-delay:4.6s">npx skills add you/my-skills</text>
</svg>
